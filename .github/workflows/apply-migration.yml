name: Apply migration (production)

# Ручное применение SQL-миграции к боевой БД.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ. Миграции в KARMAN рукописные (drizzle-kit не
# гоняем), и migration-guard в deploy-prod.yml блокирует авто-деплой, если
# коммит вносит новую миграцию: по замыслу её применяет человек с доступом к
# боевой БД. Ключ от боевой машины лежит в секретах Actions, поэтому из
# агентской сессии «применить миграцию» было НЕЧЕМ — шаг оставался на
# владельце. Решение владельца (03.11, задача «мультиаккаунт»): применять
# миграции агент, с явного добра владельца.
#
# ЧТО ЭТО НЕ ЕСТЬ. Не удалённый шелл: выполняется ТОЛЬКО файл из
# lib/db/migrations/, имя которого оператор вводит руками. Произвольных команд
# нет, произвольных веток нет (только main), деплоя тут нет — деплой
# отдельным шагом (workflow_dispatch deploy-prod.yml).
#
# ОГРАНИЧЕНИЯ:
#   - имя миграции: ^[0-9]{4}_[a-z0-9_]+\.sql$ и файл обязан существовать в main;
#   - применяется psql с ON_ERROR_STOP=1, сама миграция — в транзакции
#     (BEGIN/COMMIT), то есть падение откатывает её целиком;
#   - пароль роли НЕ попадает в argv: тот же приём, что в scripts/pg-connect.sh
#     (.pgpass + URI без пароля) — иначе соседи бокса видели бы его в /proc;
#   - воркфлоу только применяет миграцию и ничего не деплоит.

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Файл миграции из lib/db/migrations/ (например 0024_accounts.sql)'
        type: string
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
    steps:
      # Экшены запинены по SHA коммита, а не по тегу (C3, аудит #057).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Ref guard
        run: |
          set -e
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Миграция применяется только из main (сейчас $GITHUB_REF)."
            exit 1
          fi
          MIG="${{ inputs.migration }}"
          if ! printf '%s' "$MIG" | grep -qE '^[0-9]{4}_[a-z0-9_]+\.sql$'; then
            echo "::error::Имя миграции должно быть вида 0024_accounts.sql"
            exit 1
          fi
          if [ ! -f "lib/db/migrations/$MIG" ]; then
            echo "::error::Нет файла lib/db/migrations/$MIG в main"
            exit 1
          fi
          echo "применяем: lib/db/migrations/$MIG"

      # Setup SSH — копия шага из deploy-prod.yml: тот же ключ и тот же запиненный
      # known_hosts. Правку сюда повторить и там.
      - name: Setup SSH
        run: |
          set -e
          MISSING=""
          [ -z "$SSH_PRIVATE_KEY" ] && MISSING="$MISSING secrets.SSH_PRIVATE_KEY"
          [ -z "$DEPLOY_SSH_HOST" ] && MISSING="$MISSING secrets.DEPLOY_SSH_HOST"
          [ -z "$DEPLOY_SSH_PORT" ] && MISSING="$MISSING vars.DEPLOY_SSH_PORT"
          [ -z "$DEPLOY_SSH_USER" ] && MISSING="$MISSING secrets.DEPLOY_SSH_USER"
          [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ] && MISSING="$MISSING secrets.DEPLOY_SSH_KNOWN_HOSTS"
          if [ -n "$MISSING" ]; then
            echo "::error::Не заданы:$MISSING"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_karman_ci
          chmod 600 ~/.ssh/id_ed25519_karman_ci
          # Ключ хоста ПИНУЕТСЯ, а не добывается ssh-keyscan'ом на месте:
          # accept-new принял бы ЛЮБОЙ предъявленный ключ.
          echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host karman
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_karman_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Применить миграцию на проде
        run: |
          set -e
          # Файл миграции едет на бокс под СВОИМ именем: версия и имя
          # берутся из имени файла (scripts/migration_journal.sh apply), и
          # подменять их нечем — иначе в журнал попадёт не то, что применено.
          scp -q "lib/db/migrations/${{ inputs.migration }}" "karman:/tmp/${{ inputs.migration }}"
          scp -q scripts/migration_journal.sh karman:/tmp/karman-migration-journal.sh
          # stderr самого ssh НЕ печатаем: при обрыве связи ssh печатает хост и
          # порт отдельными словами, а это координаты боевой машины (D-038).
          # Диагностика скрипта едет в stdout (в нём `exec 2>&1`).
          ssh karman 'bash -s' 2>/dev/null <<'REMOTE'
          set -euo pipefail
          exec 2>&1
          # Скрипт делает ВСЁ: проверяет, не применена ли миграция уже;
          # гонит файл через psql с ON_ERROR_STOP=1 (пароль роли — в .pgpass, не
          # в argv); и СРАЗУ записывает миграцию в журнал schema_migrations.
          # Запись в журнал — часть применения, а не отдельный шаг: разорвать
          # их нельзя, иначе вернётся та дыра, ради которой всё затевалось.
          bash /tmp/karman-migration-journal.sh apply "/tmp/${{ inputs.migration }}"
          rm -f "/tmp/${{ inputs.migration }}" /tmp/karman-migration-journal.sh
          echo "миграция применена"
          REMOTE
