name: Deploy to production

# CI-artifact-деплой (мандат brain 2026-06-11): сборка едет в GitHub Actions,
# на прод по SSH уезжает готовый standalone-артефакт + рестарт systemd-сервиса.
# On-box `next build` запрещён: сборка на проде отбирает RAM/CPU у рантайма —
# на прежнем хосте она уже рвала SSH.
#
# Требуется (значения — в repo-vars/secrets, в коде их нет: D-038, репозиторий публичный):
#   secrets.SSH_PRIVATE_KEY        — приватная часть изолированного ключа karman-ci-deploy
#   secrets.DEPLOY_SSH_HOST        — DNS-имя прод-хоста (провайдер ротирует техимя)
#   secrets.DEPLOY_SSH_USER        — системный логин деплоя
#   secrets.DEPLOY_SSH_KNOWN_HOSTS — ОЖИДАЕМЫЙ публичный ключ хоста (строка known_hosts)
#   secrets.DEPLOY_BASE            — база релизов на прод-хосте
#   vars.DEPLOY_SSH_PORT           — внешний ssh-порт (22: маскировать нечего и нельзя)
#   vars.DEPLOY_APP_PORT           — порт приложения на localhost за nginx
#
# ПОЧЕМУ ИМЕННО ТАК (письмо brain 08-29, находка Калинино). `vars` НЕ маскируются:
# раннер печатает блок `env:` шага с раскрытыми значениями, и у публичного репо этот
# лог публичен. D-038 вынес координаты прода из кода — но в `vars`, то есть на вторую
# публичную поверхность. Здесь recon-чувствительное переведено в `secrets`, а в `vars`
# осознанно оставлены только два порта: маскируется КАЖДОЕ вхождение значения, и
# сверхкороткий секрет («22») изуродовал бы весь лог, не спрятав ничего ценного.
#
# Смена deploy-target при миграции = правка repo-vars/secrets, код не трогаем.

on:
  push:
    branches: [main]
    # docs/почта/markdown/инфра не меняют прод-артефакт — не гоняем пересборку зря.
    # paths-ignore срабатывает, только если ВСЕ изменённые файлы под паттернами.
    paths-ignore:
      - 'docs/**'
      - 'mailbox/**'
      - '**.md'
      - '.github/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Предохранитель миграций: standalone-бандл не несёт drizzle-kit, поэтому
      # миграции применяет разработчик вручную на проде ДО деплоя (psql/db:migrate
      # с машины разработчика). CI лишь проверяет, что коммит не вносит новых
      # .sql-миграций. workflow_dispatch = «уже применил» → guard пропускается.
      - name: Migration guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          NEW=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'lib/db/migrations/*.sql' || true)
          if [ -n "$NEW" ]; then
            echo "::error::Коммит вносит новые миграции. Примени их на проде вручную, затем запусти деплой через workflow_dispatch."
            echo "$NEW"
            exit 1
          fi
          echo "Новых миграций в коммите нет — деплой продолжается."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (standalone)
        env:
          # build не ходит в БД (страницы динамические, пул ленивый) — заглушки
          # на случай чтения env на уровне модулей (как в ci.yml).
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_dummy
          SESSION_SECRET: ci-dummy-secret-not-used-in-prod
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не найден в .next/standalone"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Воркер напоминаний (тонкое реле, без зависимостей) едет рядом с server.js;
          # его запускает karman-reminders.service из current/. См. docs/telegram-reminders.md.
          cp scripts/reminders-worker.mjs .next/standalone/reminders-worker.mjs
          # Операционные скрипты едут вместе с артефактом. Без этого каталог scripts/
          # на проде — РУЧНАЯ копия, и она расходится молча: 2026-08-25 обнаружено, что
          # прод крутит backup_vault.sh от 11 июля, то есть правка от 10 августа
          # (добавить secrets_grant / secrets_bootstrap / passport_* в дамп vault'а)
          # так и не доехала — реестр личностей и карта grant'ов не бэкапились вовсе.
          mkdir -p .next/standalone/scripts
          cp scripts/*.sh .next/standalone/scripts/
          tar czf karman-app.tgz -C .next/standalone .
          echo "bundle: $(du -h karman-app.tgz | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Recon-чувствительное — в secrets, а НЕ в vars: раннер печатает блок `env:`
          # с раскрытыми значениями, и у публичного репо этот лог публичен (находка
          # Калинино, письмо brain 08-29). Маскируется только заведённое как secrets.
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          # Порт остаётся в vars ОСОЗНАННО: маскируется каждое вхождение значения,
          # и секрет "22" замазал бы в логе все двойки-двадцатки подряд — лог стал бы
          # нечитаемым, а recon-ценность стандартного ssh-порта нулевая.
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          MISSING=""
          [ -z "$SSH_PRIVATE_KEY" ] && MISSING="$MISSING secrets.SSH_PRIVATE_KEY"
          [ -z "$DEPLOY_SSH_HOST" ] && MISSING="$MISSING secrets.DEPLOY_SSH_HOST"
          [ -z "$DEPLOY_SSH_PORT" ] && MISSING="$MISSING vars.DEPLOY_SSH_PORT"
          [ -z "$DEPLOY_SSH_USER" ] && MISSING="$MISSING secrets.DEPLOY_SSH_USER"
          [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ] && MISSING="$MISSING secrets.DEPLOY_SSH_KNOWN_HOSTS"
          if [ -n "$MISSING" ]; then
            echo "::error::Не заданы:$MISSING"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_karman_ci
          chmod 600 ~/.ssh/id_ed25519_karman_ci
          # Ключ хоста ПИНУЕТСЯ из vars, а не добывается ssh-keyscan'ом на месте.
          # Было: `ssh-keyscan … || true` в паре со `StrictHostKeyChecking accept-new`.
          # При сбое keyscan шаг молча шёл дальше с пустым known_hosts, а accept-new
          # принимал ЛЮБОЙ предъявленный ключ — то есть окно MITM ровно на том канале,
          # по которому уезжает артефакт и выполняется `sudo systemctl restart`.
          # Сам ключ хоста не секрет (это публичная половина) — но строка known_hosts
          # начинается с ИМЕНИ хоста, а оно recon-чувствительно и печаталось бы в
          # публичный лог из блока `env:`. Поэтому строка целиком живёт в secrets.
          echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host karman
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User $DEPLOY_SSH_USER
            IdentityFile ~/.ssh/id_ed25519_karman_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Ship artifact + restart
        env:
          # В secrets: путь несёт системный логин (`/home/<user>/…`) и раскрывал бы
          # раскладку прод-бокса в публичном логе. См. комментарий в «Setup SSH».
          DEPLOY_BASE: ${{ secrets.DEPLOY_BASE }}
        run: |
          set -e
          if [ -z "$DEPLOY_BASE" ]; then echo "::error::Не задан secrets.DEPLOY_BASE"; exit 1; fi
          scp -q karman-app.tgz karman:/tmp/karman-app.tgz
          ssh karman 'bash -s' "${{ github.sha }}" "$DEPLOY_BASE" <<'REMOTE'
          set -e
          SHA="$1"
          BASE="$2"
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/karman-app.tgz -C "$REL"
          rm -f /tmp/karman-app.tgz
          ln -sfn "$REL" "$BASE/current"
          # Синхронизация операционных скриптов (их запускает cron, а не приложение,
          # поэтому они живут вне релиз-каталога). Только копирование, без удаления:
          # чистка прод-путей автоматикой — не то, что стоит делать молча.
          mkdir -p "$BASE/scripts"
          cp -f "$REL/scripts/"*.sh "$BASE/scripts/" 2>/dev/null || true
          sudo systemctl restart karman
          # держим последние 5 релизов
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      # #011 smoke: health + корень (307 → логин без сессии — норма).
      - name: Smoke check
        env:
          # Без дефолта намеренно: прежний `|| '3000'` расходился с боевым портом,
          # то есть смоук стучался бы не в то приложение и молчал бы об этом.
          APP_PORT: ${{ vars.DEPLOY_APP_PORT }}
        run: |
          set -e
          if [ -z "$APP_PORT" ]; then echo "::error::Не задан vars.DEPLOY_APP_PORT"; exit 1; fi
          ssh karman 'bash -s' "$APP_PORT" <<'REMOTE'
          set -e
          PORT="$1"
          sleep 5   # дать сервису подняться после restart
          fail=0
          check() {
            path="$1"; expected="$2"
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:$PORT$path" || true)
            echo "local $path → $status (ожидалось: $expected)"
            case " $expected " in
              *" $status "*) ;;
              *) echo "::error::local $path = $status, ожидалось одно из: $expected"; fail=1 ;;
            esac
          }
          check "/api/health" "200"
          check "/"           "200 307"
          exit $fail
          REMOTE

      - name: On failure — журналы прода
        if: failure()
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          # Дамп журнала — третий канал утечки (письмо brain 08-29), и переводом
          # переменных в secrets он НЕ лечится:
          #   - маскируется только точное вхождение значения целиком, а journal
          #     печатает КОРОТКИЙ хостнейм (`box`, не `box.vps.example.ru`) —
          #     префикс секрета маскировщик не трогает;
          #   - `systemctl status` несёт путь юнита в `Loaded:` и хвост журнала;
          #   - ошибка подключения к БД печатает целую строку соединения.
          # Поэтому: формат без префиксов + собственная редакция на выходе.
          SHORT="${DEPLOY_SSH_HOST%%.*}"
          redact() {
            if [ -n "$SHORT" ]; then sed -E "s/${SHORT}/[host]/g"; else cat; fi \
              | sed -E 's#(://)[^:/@[:space:]]+:[^@[:space:]]+@#\1***:***@#g'
          }
          # `show` вместо `status`: состояние и счётчик падений без путей и журнала.
          ssh karman "sudo systemctl show karman -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts" 2>&1 | redact || true
          # `-o cat` — только сообщение, без метки времени и хостнейма в каждой строке.
          ssh karman "sudo journalctl -u karman -n 80 --no-pager -o cat" 2>&1 | redact || true
