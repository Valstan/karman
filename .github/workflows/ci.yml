# Гейты качества KARMAN (#027 gate-replaced autonomy): typecheck + lint + vitest + build.
# Зелёный CI — предпосылка авто-мержа PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # build не ходит в БД (страницы динамические, пул ленивый) — заглушки на случай
      # чтения env на уровне модулей.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_dummy
      SESSION_SECRET: ci-dummy-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Уязвимости рантайм-зависимостей (Q3-самоосмотр, R4). Порог — high: до
      # 2026-08-10 четыре high-CVE в libvips через sharp жили в проде месяц, и
      # увидеть их можно было, только запустив audit руками. Dev-зависимости
      # исключены намеренно: они не едут в прод-артефакт, а их шум глушил бы гейт.
      - run: npm audit --omit=dev --audit-level=high
