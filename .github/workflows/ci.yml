# Гейты качества KARMAN (#027 gate-replaced autonomy): typecheck + lint + vitest + build.
# Зелёный CI — предпосылка авто-мержа PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # build не ходит в БД (страницы динамические, пул ленивый) — заглушки на случай
      # чтения env на уровне модулей.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_dummy
      SESSION_SECRET: ci-dummy-secret-not-used-in-prod
    steps:
      # Экшены запинены по SHA коммита, а НЕ по тегу (C3, аудит #057): тег
      # `v5` — mutable-ссылка, и whoever может двинуть тег в actions/checkout
      # получает выполнение своего кода в нашем CI с нашими правами. Комментарий
      # с тегом оставлен рядом — по нему видно, чему соответствует SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Сканеру секретов нужна ИСТОРИЯ, а не один коммит: без этого гейт
          # зелен ровно в том сценарии, ради которого ставится.
          #
          # ⚠️ Побочный эффект, неочевидный до первого раза: с fetch-depth: 0
          # checkout тянет ВСЕ ветки репозитория, а `gitleaks git .` сканирует все
          # достижимые коммиты. Значит подсадной секрет из одноразовой ветки
          # приёмки краснит и посторонние PR, пока ветка жива на remote.
          # Вывод: ветку приёмки удалять сразу после красного прогона.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Уязвимости рантайм-зависимостей (Q3-самоосмотр, R4). Порог — high: до
      # 2026-08-10 четыре high-CVE в libvips через sharp жили в проде месяц, и
      # увидеть их можно было, только запустив audit руками. Dev-зависимости
      # исключены намеренно: они не едут в прод-артефакт, а их шум глушил бы гейт.
      - run: npm audit --omit=dev --audit-level=high
      # Потолок живого backlog'а (D-096, письмо brain 2026-09-18). Файл читается целиком
      # каждым /start, и к 21.09 дорос до 66 КБ — закрытое уезжает в docs/pending-archive/.
      # Гейт, а не памятка: проверка только в голове агента гейтом не считается (#125).
      # stat -c, а не wc -c: wc печатает имя файла, и сравнение чисел падает молча.
      - name: PENDING_FOLLOWUPS.md size
        run: |
          set -euo pipefail
          size=$(stat -c %s docs/PENDING_FOLLOWUPS.md)
          echo "docs/PENDING_FOLLOWUPS.md: ${size} bytes (limit 51200)"
          if [ "$size" -gt 51200 ]; then
            echo "::error::PENDING_FOLLOWUPS.md exceeds 50 KB - move closed items to docs/pending-archive/"
            exit 1
          fi
      # Сканер секретов (мандат brain 2026-08-17 / D-030). Репозиторий публичный
      # с 17.08, а у публичного репо утёкший секрет скомпрометирован С СЕКУНДЫ
      # пуша — форки и кэши не отозвать, «удалить коммит» не лечит.
      #
      # Бинарь с явными флагами, а не gitleaks-action: три обязательных свойства
      # видны прямо здесь и не зависят от умолчаний обёртки —
      #   fetch-depth: 0 (выше)  ·  --redact  ·  --exit-code 1.
      # --redact критичен: без него найденный секрет печатается в лог CI, то есть
      # утекает второй раз, уже в публичный вечный лог Actions.
      #
      # Конфиг .gitleaks.toml расширяет дефолтные 195 правил, а не заменяет их:
      # дефолт НЕ видит VK-токен вовсе и пропускает Telegram-токен внутри URL
      # (замерено Сарафаном, оба класса в портфеле реально утекали), а наши
      # собственные skm_/skb_ и SECRETS_MASTER_KEY не знает никто, кроме нас.
      #
      # C3, аудит #057: бинарь скачивается с ПРОВЕРКОЙ sha256. Раньше он тянулся
      # по HTTPS и распаковывался сразу — подмена бинаря на этапе загрузки (или
      # MITM там, где TLS дырявый) давала бы исполнение чужого кода в публичном
      # CI. Контрольная сумма зашита в репозиторий: её видно в PR, и она меняется
      # только вместе с обновлением версии.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VER: 8.30.1
          # sha256 файла `gitleaks_8.30.1_linux_x64.tar.gz` из официального
          # gitleaks_8.30.1_checksums.txt (сверен локальным пересчётом файла).
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          ./gitleaks version
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1 --no-banner --verbose
