# Референс-конфиг nginx для KARMAN (единый Next.js, порт приложения — см. systemd-юнит).
# Заменяет старую схему (статика frontend_dist/ + проксирование /api → отдельный бэкенд).
# TLS-блок (listen 443) дописывает certbot автоматически.
#
# ⚠️ server_name ОБЯЗАН перечислять боевое имя буква-в-букву, и для кириллического
# домена — В PUNYCODE (браузер шлёт Host именно так). Приложение живёт на машине не одно;
# у одного из соседей стоит `default_server`. Запрос, не совпавший ни с одним server_name,
# уходит к нему — и браузер получает ЧУЖОЙ сертификат: ERR_CERT_COMMON_NAME_INVALID,
# то есть внешне неотличимо от попытки перехвата. Наступили на это 2026-08-25: запись
# в DNS была заведена, а vhost знал только технический хостнейм машины — по домену сайт
# не открывался ни разу, и выглядело это для владельца как предупреждение об атаке.
# Placeholder `_` ниже НЕ оставлять — он ловит что угодно только у default_server,
# а у обычного vhost'а молча не совпадает ни с чем.
#
# НЕТ и не заводить без нужды: блока `upstream { ... keepalive N; }`. Без него nginx
# не держит пул idle-соединений к приложению, и грабля G234 (прокси шлёт запрос в сокет,
# который Node только что закрыл по своему 5-секундному keepAliveTimeout → случайные 502
# при пустых логах приложения) на нашей топологии не воспроизводится. Заведёте пул —
# в тот же момент понадобится KEEP_ALIVE_TIMEOUT в systemd-юните больше вашего `keepalive`
# (он там уже проставлен, см. scripts/karman.service).

server {
    listen 80;
    listen [::]:80;
    # ЗАМЕНИТЬ на боевое имя. Кириллический домен писать в punycode (`xn--...`) —
    # получить его можно через `node -e "console.log(new URL('https://<домен>').host)"`.
    # Несколько имён — через пробел (технический хостнейм машины + публичный домен).
    server_name PUT_PUNYCODE_HOSTNAME_HERE;

    client_max_body_size 100M;

    # Единый проксипас на Next.js. /api/health и все страницы — один процесс.
    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ВАЖНО: нужно для Secure-cookie и определения протокола в Next.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Приёмка после правки (выполнять НА машине, не с рабочего PC — исходящий HTTPS
# с рабочей машины идёт через прокси и таймаутит):
#
#   sudo nginx -t && sudo systemctl reload nginx
#   echo | openssl s_client -connect 127.0.0.1:443 -servername <punycode> 2>/dev/null \
#     | openssl x509 -noout -subject      # CN обязан совпасть с запрошенным именем
#   curl -s --resolve <punycode>:443:127.0.0.1 https://<punycode>/api/health
#
# Зелёный `nginx -t` НЕ доказывает, что имя совпало: конфиг с неверным server_name
# синтаксически корректен. Доказывает только subject сертификата в ответе.
